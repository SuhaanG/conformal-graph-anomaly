name = "ConformalFDR"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ConformalFDR"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "ConformalFDR"
